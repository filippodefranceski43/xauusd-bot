name: Monitoraggio XAUUSD

# Fa partire bot.py con due frequenze diverse:
# - ogni minuto tra le 7:00 e le 21:59 UTC (= 9:00-23:00 ora italiana, sia
#   solare che legale) -> controllo segnali + apertura/chiusura mercato
# - ogni 30 minuti nel resto della giornata (notte) -> SOLO controllo
#   apertura/chiusura mercato (bot.py stesso salta i segnali fuori fascia)
# La finestra notturna (21-23 e 0-8 UTC) e' volutamente piu' ampia della
# notte italiana vera per coprire in sicurezza sia l'ora solare che legale.
#
# Perche' non ogni minuto anche di notte: supererebbe il limite gratuito di
# Twelve Data (800 richieste/giorno). Con questa combinazione restiamo
# ampiamente sotto soglia.
#
# NOTA IMPORTANTE: GitHub non garantisce che i cron job partano esattamente
# al minuto preciso, soprattutto con intervalli cosi' brevi - nei momenti di
# traffico alto sulla piattaforma possono esserci ritardi di qualche minuto.
# E' il limite del piano gratuito, non un errore di configurazione.
on:
  schedule:
    - cron: "*/1 7-21 * * *"
    - cron: "*/30 21-23 * * *"
    - cron: "*/30 0-8 * * *"
  workflow_dispatch: {}  # permette anche di farlo partire manualmente da GitHub per testare

jobs:
  controlla-mercato:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il controllo del mercato
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: python bot.py
