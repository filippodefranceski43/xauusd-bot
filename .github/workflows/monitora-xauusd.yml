name: Monitoraggio XAUUSD

# Fa partire bot.py ogni minuto, tra le 7:00 e le 21:59 UTC.
# Questa finestra UTC copre sempre le 9:00-23:00 ora italiana, sia in ora
# solare (UTC+1) che in ora legale (UTC+2). Il controllo preciso sull'orario
# esatto (9:00-23:00 Italia) lo fa comunque bot.py appena parte: se e' fuori
# fascia si ferma subito senza consumare altro.
#
# NOTA IMPORTANTE: GitHub non garantisce che i cron job partano esattamente
# al minuto preciso, soprattutto con intervalli cosi' brevi - nei momenti di
# traffico alto sulla piattaforma possono esserci ritardi di qualche minuto.
# E' il limite del piano gratuito, non un errore di configurazione.
on:
  schedule:
    - cron: "*/1 7-21 * * *"
  workflow_dispatch: {}  # permette anche di farlo partire manualmente da GitHub per testare

jobs:
  controlla-mercato:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il controllo del mercato
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: python bot.py
